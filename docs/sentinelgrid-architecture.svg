<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#0b1120; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gradDb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrowhead-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#gradBg)"/>

  <!-- Title Banner -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="1080" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="32" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="0.5">SentinelGrid — High-Level Architecture &amp; Data Pipeline</text>
    <text x="30" y="54" font-size="13" font-weight="500" fill="#94a3b8">Gujarat Police Innovation Challenge 2026 | Problem ID: KANADSHIELD26_P2_10 | State-Wide CCTV GIS &amp; Watchlist Analytics</text>
    <rect x="910" y="16" width="140" height="36" rx="8" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="980" y="39" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">Hybrid Model (1 + 3)</text>
  </g>

  <!-- LAYER 1: CLIENT FRONTEND -->
  <g transform="translate(60, 145)">
    <rect x="0" y="0" width="1080" height="150" rx="14" fill="url(#gradFront)" stroke="#38bdf8" stroke-width="1.8"/>
    <rect x="0" y="0" width="1080" height="34" rx="12" fill="#0284c7" fill-opacity="0.2"/>
    <text x="24" y="23" font-size="14" font-weight="700" fill="#38bdf8" letter-spacing="0.5">TIER 1: PRESENTATION LAYER (React.js + Vite + Leaflet.js)</text>
    <text x="1055" y="23" font-size="12" font-weight="500" fill="#7dd3fc" text-anchor="end">TailwindCSS | Dark Glassmorphism</text>

    <!-- Component Cards -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="28" font-size="13" font-weight="700" fill="#f1f5f9">GIS Registry Map</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">Leaflet.js + PostGIS</text>
      <text x="15" y="65" font-size="11" fill="#38bdf8">Gap Analysis Overlay</text>
    </g>

    <g transform="translate(230, 50)">
      <rect x="0" y="0" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="28" font-size="13" font-weight="700" fill="#f1f5f9">Vehicle Route Tracker</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">Chronological Graph</text>
      <text x="15" y="65" font-size="11" fill="#10b981">Interactive Playback</text>
    </g>

    <g transform="translate(440, 50)">
      <rect x="0" y="0" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="28" font-size="13" font-weight="700" fill="#f1f5f9">Live Alerts Dashboard</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">Sub-100ms Push</text>
      <text x="15" y="65" font-size="11" fill="#f43f5e">Audio Chime + Pulsing Pin</text>
    </g>

    <g transform="translate(650, 50)">
      <rect x="0" y="0" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="28" font-size="13" font-weight="700" fill="#f1f5f9">Camera Onboarding</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">Manual Single Form</text>
      <text x="15" y="65" font-size="11" fill="#a855f7">Bulk CSV Pre-commit</text>
    </g>

    <g transform="translate(860, 50)">
      <rect x="0" y="0" width="200" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="28" font-size="13" font-weight="700" fill="#f1f5f9">Audit Trail &amp; RBAC</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">Cross-Dept Search Logs</text>
      <text x="15" y="65" font-size="11" fill="#eab308">DPDP Compliance</text>
    </g>
  </g>

  <!-- Flow Connectors Layer 1 to Layer 2 -->
  <line x1="205" y1="295" x2="205" y2="355" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <line x1="415" y1="295" x2="415" y2="355" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead-emerald)"/>
  <line x1="625" y1="355" x2="625" y2="295" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <line x1="835" y1="295" x2="835" y2="355" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowhead-purple)"/>

  <!-- LAYER 2: BACKEND ENGINE -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="1080" height="175" rx="14" fill="url(#gradBack)" stroke="#6366f1" stroke-width="1.8"/>
    <rect x="0" y="0" width="1080" height="34" rx="12" fill="#4f46e5" fill-opacity="0.2"/>
    <text x="24" y="23" font-size="14" font-weight="700" fill="#818cf8" letter-spacing="0.5">TIER 2: BACKEND APPLICATION ENGINE (Python 3.11 + FastAPI Async)</text>
    <text x="1055" y="23" font-size="12" font-weight="500" fill="#c7d2fe" text-anchor="end">RESTful APIs | Async WebSockets | ONNX AI Inference</text>

    <!-- Backend Modules -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="190" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="26" font-size="13" font-weight="700" fill="#f1f5f9">Spatial Registry API</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">• PostGIS GeoJSON Serializer</text>
      <text x="15" y="68" font-size="11" fill="#94a3b8">• ST_DWithin Gap Query</text>
      <text x="15" y="88" font-size="11" fill="#38bdf8">• Bulk CSV Validator</text>
    </g>

    <g transform="translate(230, 50)">
      <rect x="0" y="0" width="190" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="26" font-size="13" font-weight="700" fill="#f1f5f9">Vehicle Track Engine</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">• Chronological Event Sorter</text>
      <text x="15" y="68" font-size="11" fill="#94a3b8">• Spatial Node Joiner</text>
      <text x="15" y="88" font-size="11" fill="#10b981">• Speed &amp; Vector Calc</text>
    </g>

    <g transform="translate(440, 50)">
      <rect x="0" y="0" width="190" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="26" font-size="13" font-weight="700" fill="#f1f5f9">AI Matching Engine</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">• TensorRT / ONNX ANPR</text>
      <text x="15" y="68" font-size="11" fill="#94a3b8">• Face Cosine Sim (0.85)</text>
      <text x="15" y="88" font-size="11" fill="#f43f5e">• Human-in-the-Loop Filter</text>
    </g>

    <g transform="translate(650, 50)">
      <rect x="0" y="0" width="190" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="26" font-size="13" font-weight="700" fill="#f1f5f9">WebSocket Manager</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">• Async Pub/Sub Broadcast</text>
      <text x="15" y="68" font-size="11" fill="#94a3b8">• Connection Heartbeat</text>
      <text x="15" y="88" font-size="11" fill="#a855f7">• Sub-100ms Latency</text>
    </g>

    <g transform="translate(860, 50)">
      <rect x="0" y="0" width="200" height="105" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="26" font-size="13" font-weight="700" fill="#f1f5f9">Dept RBAC &amp; Adapters</text>
      <text x="15" y="48" font-size="11" fill="#94a3b8">• Police / RTO / AMC Scope</text>
      <text x="15" y="68" font-size="11" fill="#94a3b8">• RTSP &amp; REST Adapters</text>
      <text x="15" y="88" font-size="11" fill="#eab308">• Tamper-Evident Audit Log</text>
    </g>
  </g>

  <!-- Flow Connectors Layer 2 to Layer 3 -->
  <line x1="320" y1="535" x2="320" y2="590" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead-emerald)"/>
  <line x1="600" y1="535" x2="600" y2="590" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="880" y1="535" x2="880" y2="590" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowhead-purple)"/>

  <!-- LAYER 3: DATABASE & SPATIAL STORAGE -->
  <g transform="translate(60, 595)">
    <rect x="0" y="0" width="1080" height="160" rx="14" fill="url(#gradDb)" stroke="#10b981" stroke-width="1.8"/>
    <rect x="0" y="0" width="1080" height="34" rx="12" fill="#059669" fill-opacity="0.2"/>
    <text x="24" y="23" font-size="14" font-weight="700" fill="#34d399" letter-spacing="0.5">TIER 3: DATA &amp; SPATIAL PERSISTENCE (PostgreSQL 15 + PostGIS 3.3 Spatial Engine)</text>
    <text x="1055" y="23" font-size="12" font-weight="500" fill="#6ee7b7" text-anchor="end">Active-Active Replication | RPO &lt; 1s | RTO &lt; 5s</text>

    <!-- Database Tables Grid -->
    <g transform="translate(20, 48)">
      <rect x="0" y="0" width="155" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#f8fafc">cameras</text>
      <text x="15" y="44" font-size="10" fill="#34d399">GEOGRAPHY(POINT,4326)</text>
      <text x="15" y="60" font-size="10" fill="#94a3b8">GIST Spatial Index</text>
      <text x="15" y="76" font-size="10" fill="#94a3b8">status, department_id</text>
    </g>

    <g transform="translate(195, 48)">
      <rect x="0" y="0" width="155" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#f8fafc">events</text>
      <text x="15" y="44" font-size="10" fill="#94a3b8">chronological log</text>
      <text x="15" y="60" font-size="10" fill="#94a3b8">camera_id, timestamp</text>
      <text x="15" y="76" font-size="10" fill="#38bdf8">license_plate, speed</text>
    </g>

    <g transform="translate(370, 48)">
      <rect x="0" y="0" width="155" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#f8fafc">watchlist_entries</text>
      <text x="15" y="44" font-size="10" fill="#f43f5e">5 Crime Categories</text>
      <text x="15" y="60" font-size="10" fill="#94a3b8">identifier, embeddings</text>
      <text x="15" y="76" font-size="10" fill="#94a3b8">source_authority</text>
    </g>

    <g transform="translate(545, 48)">
      <rect x="0" y="0" width="155" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#f8fafc">alerts</text>
      <text x="15" y="44" font-size="10" fill="#f43f5e">Sub-100ms Ticker</text>
      <text x="15" y="60" font-size="10" fill="#94a3b8">confidence_score</text>
      <text x="15" y="76" font-size="10" fill="#94a3b8">status, dispatch_unit</text>
    </g>

    <g transform="translate(720, 48)">
      <rect x="0" y="0" width="155" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#f8fafc">departments</text>
      <text x="15" y="44" font-size="10" fill="#818cf8">Police / RTO / AMC</text>
      <text x="15" y="60" font-size="10" fill="#94a3b8">Food / Civil / Mining</text>
      <text x="15" y="76" font-size="10" fill="#94a3b8">jurisdiction, regions</text>
    </g>

    <g transform="translate(895, 48)">
      <rect x="0" y="0" width="165" height="95" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" font-size="12" font-weight="700" fill="#f8fafc">audit_log</text>
      <text x="15" y="44" font-size="10" fill="#eab308">Immutable Append-only</text>
      <text x="15" y="60" font-size="10" fill="#94a3b8">user_id, dept, query</text>
      <text x="15" y="76" font-size="10" fill="#94a3b8">timestamp, ip_address</text>
    </g>
  </g>
</svg>
